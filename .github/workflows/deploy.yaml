name: Deploy to Server

on:
  # Cutover: deploy now fires when the RUST workflow passes on master.
  # This swap MUST land together with the cutover commit (new deploy.sh +
  # deploy/gunlinux-ru.service): before the cutover, a master push would
  # otherwise run the new deploy.sh against the still-Python server.
  workflow_run:
    workflows: ["Rust"]
    branches: [master]
    types:
      - completed
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.PRIVATE_KEY_SSH }}

    - name: Deploy to Server
      run: |
        ssh -o "StrictHostKeyChecking=no" "loki@gunlinux.ru" 'bash -s' < .github/deploy.sh
