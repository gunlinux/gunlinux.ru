name: Rust

# Quality gate for the Rust (axum) workspace. Runs on every push/PR; the
# "Deploy to Server" workflow triggers on this workflow's success on master
# (workflow_run), so anything merged to master that passes here ships.
#
# The default test suite serves the real esbuild bundle from app/static/dist
# (gitignored), so CI builds the CSS before running cargo tests.

on: [push, pull_request]

defaults:
  run:
    working-directory: rust

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin to the project toolchain (cargo 1.96, matching rust/Dockerfile) —
      # rustfmt output is version-sensitive and must match contributors.
      # rustfmt/clippy are separate components the action does not install
      # by default.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      # The persistence suite provisions per-test scratch databases; with
      # TEST_DATABASE_URL set it uses this service instead of testcontainers.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - name: Build CSS bundle
        working-directory: .
        run: make css-build
      - run: cargo test --workspace

  browser-e2e:
    name: Browser e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      # Browser tests load the vendored htmx from /static; the bundle must
      # exist even though the browser tests don't assert on CSS.
      - name: Build CSS bundle
        working-directory: .
        run: make css-build
      - run: cargo test -p web --features browser-tests --test test_browser
