[package]
name = "persistence"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
domain = { path = "../domain" }
sea-orm = { version = "1", features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
# Used by tests/common/postgres.rs to spin up a `postgres:16` container when
# TEST_DATABASE_URL is not set (CI provides it via a service container).
tempfile = "3"
testcontainers = "0.28"
