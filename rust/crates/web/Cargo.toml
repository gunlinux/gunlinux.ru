[package]
name = "web"
version = "0.1.0"
edition = "2021"

[dependencies]
application = { path = "../application" }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "form"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
domain = { path = "../domain" }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
include_dir = "0.7"
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto"] }
minijinja = { version = "2", features = ["loader", "loop_controls"] }
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"

# Headless-browser E2E tests (opt-in). chromiumoxide is CDP-based and drives a
# real Chrome/Chromium; the `fetcher` feature can download a Chromium binary
# when none is installed (see tests/test_browser.rs). `chromiumoxide_fetcher`
# is listed directly with its default features (rustls + zip) because the
# `fetcher` feature enables it with default-features=false, which would leave
# the downloader without a TLS backend. `futures` drives the CDP event-handler
# stream. All three are optional and only compiled when the `browser-tests`
# feature is enabled, keeping the default `cargo test` fast and offline.
chromiumoxide = { version = "0.9", optional = true, features = ["fetcher"] }
chromiumoxide_fetcher = { version = "0.9", optional = true }
futures = { version = "0.3", optional = true }

[features]
browser-tests = [
    "dep:chromiumoxide",
    "dep:chromiumoxide_fetcher",
    "dep:futures",
]

[dev-dependencies]
