    {% for group in posts_by_year %}
        <div class="postGroup">
            <h3 class="postGroup__title">{{group.year}}</h3>
            <div class="postGroup__content">
                {% for post in group.posts %}
                <div class="minipost">
                    <a class="minipost__title" href="/{{post.alias}}"
        hx-swap="posts" hx-get="/{{post.alias}}"
        hx-trigger="click"
        hx-target=".page__content"
        hx-push-url="true"
>
                        {{post.pagetitle}}
                    </a>
                    <span class="minipost__date">
                        {{post.publishedon|strftime("%B %d, %Y")}}
                    </span>
                </div>
                {% endfor %}
            </div>
        </div>
    {% endfor %}
