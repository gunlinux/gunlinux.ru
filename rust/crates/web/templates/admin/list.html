{% extends "admin/layout.html" %}

{% block title %}{{ model.name_plural }}{% endblock %}

{% block content %}
<div class="admin-page-head">
  <h1 class="admin-title">{{ model.name_plural }} <span class="admin-title__count">{{ total }}</span></h1>
  <a class="admin-btn admin-btn--primary" href="/admin/{{ model.slug }}/create">Create {{ model.name }}</a>
</div>
<form class="admin-search" method="get" action="/admin/{{ model.slug }}/"
      hx-get="/admin/{{ model.slug }}/" hx-target="#list-table" hx-swap="outerHTML"
      hx-push-url="true" hx-trigger="input changed delay:300ms, submit">
  <input type="search" name="search" value="{{ search }}" placeholder="Search {{ model.name_plural }}…" aria-label="Search">
  <button type="submit" class="admin-btn">Search</button>
</form>
{% include "admin/list_table.html" %}
{% endblock %}
