{% extends "admin/layout.html" %}

{% block title %}Admin login{% endblock %}

{% block sidebar %}{% endblock %}

{% block content %}
<div class="admin-login">
  <div class="admin-login__card">
    <h1 class="admin-title">Admin login</h1>
    {% if error %}<div class="admin-alert admin-alert--error">{{ error }}</div>{% endif %}
    <form method="post" action="/admin/login" class="admin-form">
      <div class="admin-field">
        <label class="admin-field__label" for="username">Username</label>
        <input id="username" type="text" name="username" autofocus required>
      </div>
      <div class="admin-field">
        <label class="admin-field__label" for="password">Password</label>
        <input id="password" type="password" name="password" required>
      </div>
      <div class="admin-form__actions">
        <button type="submit" class="admin-btn admin-btn--primary">Login</button>
      </div>
    </form>
    <p class="admin-login__back"><a href="/">← back to site</a></p>
  </div>
</div>
{% endblock %}
