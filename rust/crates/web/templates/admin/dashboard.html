{% extends "admin/layout.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<h1 class="admin-title">Dashboard</h1>
<div class="admin-cards">
{% for m in models %}
<a class="admin-card" href="/admin/{{ m.slug }}/">
  <span class="admin-card__name">{{ m.name_plural }}</span>
  <span class="admin-card__count">{{ counts[m.slug] }}</span>
</a>
{% endfor %}
</div>
{% endblock %}
