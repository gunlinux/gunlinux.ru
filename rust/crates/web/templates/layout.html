<!DOCTYPE html>
<html data-theme="dark">
    <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>{% if post %}{{post.pagetitle}}{% else %}Неразумный перфекционизм{% endif %}</title>
    <meta name="description" content="{% if post %}{{post.pagetitle}}{% endif %}">
    <link rel="alternate" type="application/rss+xml" href="https://gunlinux.ru/rss.xml" title="rss feed">
    {% if settings.yandex_verification %}
      <meta name="yandex-verification" content="{{ settings.yandex_verification }}"/>
    {% endif %}
    <link href="/static/img/favicon.ico" rel="shortcut icon" />
    {% if inline_css %}
    <style>{{ inline_css|safe }}</style>
    {% else %}
    <link rel="stylesheet" href="/static/dist/css/bundle.css">
    {% endif %}
    <script defer src="/static/vendor/htmx.min.js"></script>
    {% block styles %}
    {% endblock %}
</head>
<body class="page {% block body_classes %} {% endblock %}">
    <div class="header">
        <a href="/"
hx-swap="posts" hx-get="/posts"
            hx-trigger="click"
            hx-target=".page__content"
class="header__logo" title="На главную">@gunlinux</a>
        <div class="header__nav">
            <div hx-swap="innerHTML" hx-get="/hx/pages"
              hx-trigger="load"
              hx-target=".pages_nav">
            </div>
            <nav class="nav">
                <a
                hx-get="/tags"
                hx-trigger="click"
                hx-target=".page__content"
                hx-push-url="true"
                href="/tags/" class="nav__link">
              tags</a>
            <span class="pages_nav"></span>
            </nav>
        </div>
    </div>
    {% block content %}
    {% endblock %}
    {% block scripts %}
    {% endblock %}
    {% include "footer.html" %}
    </body>
</html>
