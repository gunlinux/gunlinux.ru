<footer class="footer">

  <div class="footer__content">
    <div hx-swap="innerHTML" hx-get="/hx/icons"
         hx-trigger="load"
         hx-target=".footer__links">
    </div>

    <div class="footer__links">
      {% for icon in icons %}
        <a href="{{icon.url}}" title="{{icon.title}}" target="_blank" aria-label="{{icon.title}}" class="nav__link">
          {{icon.content|safe}}
        </a>
      {% endfor %}
    </div>
  </div>
</footer>
