[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/persistence",
    "crates/web",
    "crates/server",
]

# Small, deployment-friendly release binary: strip symbols, thin LTO, single
# codegen unit. The Docker image is the only release consumer.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
