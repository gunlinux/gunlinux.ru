{% extends "sqladmin/edit.html" %}

{% block head_css %}
{{ super() }}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/easymde/2.18.0/easymde.min.css">
{% endblock %}

{% block tail %}
{{ super() }}
<script src="https://cdnjs.cloudflare.com/ajax/libs/easymde/2.18.0/easymde.min.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var ta = document.getElementById('content');
    if (!ta) return;
    new EasyMDE({
      element: ta,
      autosave: { enabled: false },
      previewRender: function (plainText, preview) {
        fetch('/md/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(plainText),
        }).then(function (r) { return r.json(); }).then(function (d) {
          preview.innerHTML = d.data;
        });
        return 'Loading…';
      },
    });
  });
</script>
{% endblock %}
